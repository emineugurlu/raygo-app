name: Mobile CI - Code Quality

on: [push, pull_request]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: TypeScript Check
        run: npx tsc
      - name: Lint Check
        run: npx eslint .
        
